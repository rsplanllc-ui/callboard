<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>茉莉奶白叫号屏</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* Layout: TV = fixed 1920x1080 stage scaled to window, 30 cards (6x5) per page; >30 ready orders rotate pages every 7s.
   Copy: English first (bold, large), Chinese underneath as reference.
   Counter = phone app with two tabs: 出餐 (mark ready -> goes on TV) and 取餐 (mark picked up -> leaves TV).
   Single deliberate brand look: Molly Tea pink + ink. */
:root{
  --ground:#edc4cc; --card:#f6e1e5; --ink:#1e1216; --muted:#84525f; --petal:#f2b6c3; --late:#a0384e;
  --f-latin: Jost, "Noto Sans SC", system-ui, sans-serif;
  --f-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-cjk);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- TV ---------- */
#tv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1920px;height:1080px;flex:none;box-sizing:border-box;padding:30px 72px 24px;display:flex;flex-direction:column;gap:16px;transform-origin:center center}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.brand b{font-family:var(--f-latin);font-weight:500;font-size:34px;letter-spacing:.08em;line-height:1}
.brand span{font-size:15px;letter-spacing:.42em;padding-left:.42em;color:var(--muted)}
.clock{justify-self:end;font-family:var(--f-latin);font-weight:300;font-size:30px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;padding-bottom:12px;border-bottom:1px solid rgba(30,18,22,.55)}
.head h1{margin:0;font-family:var(--f-latin);font-weight:700;font-size:54px;line-height:1;letter-spacing:.06em}
.head .zh{font-size:18px;letter-spacing:.4em;color:var(--muted);margin-top:6px}
.page{font-family:var(--f-latin);font-weight:600;font-size:26px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.card{position:relative;box-sizing:border-box;border-radius:6px;padding:11px 16px 10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;background:var(--card);color:var(--ink);overflow:hidden}
.card .r1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card .n{font-family:var(--f-latin);font-weight:600;font-size:56px;line-height:.86;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card .id{display:flex;flex-direction:column;gap:1px;min-width:0;padding-top:6px;border-top:1px solid rgba(30,18,22,.14)}
.card .l1{font-size:21px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .l2{font-family:var(--f-latin);font-size:17px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;font-family:var(--f-latin);font-size:14px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.tag svg{width:18px;height:18px}
.tag img{width:22px;height:22px;border-radius:5px;display:block}
.card.fresh{background:var(--ink);color:var(--card)}
.card.fresh .n{color:var(--petal)}
.card.fresh .tag,.card.fresh .l2{color:#d9a3b0}
.card.fresh .id{border-top-color:rgba(242,182,195,.3);padding-right:118px}
.jr{position:absolute;right:12px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.jr b{font-family:var(--f-latin);font-weight:700;font-size:15px;letter-spacing:.1em;background:var(--petal);color:var(--ink);border-radius:999px;padding:5px 11px}
.jr small{font-size:11px;letter-spacing:.2em;color:#d9a3b0;margin-top:4px}
.grid.flip{animation:flip .5s ease}
@keyframes flip{0%{opacity:0}100%{opacity:1}}
.card.arrive{animation:arrive .9s cubic-bezier(.2,.8,.2,1)}
@keyframes arrive{0%{transform:scale(.9);opacity:.2}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.slot{border:1px solid rgba(30,18,22,.08);border-radius:6px}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding-top:8px;border-top:1px solid rgba(30,18,22,.25);color:var(--muted)}
.foot .bi{display:flex;flex-direction:column;gap:3px}
.foot .bi b{font-family:var(--f-latin);font-weight:600;font-size:16px;letter-spacing:.2em}
.foot .bi small{font-size:12px;letter-spacing:.3em}
.foot .r{text-align:right;align-items:flex-end}
.more{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--ink);color:var(--card);border-radius:999px;padding:5px 28px}
.more b{font-family:var(--f-latin);font-weight:700;font-size:20px;letter-spacing:.06em}
.more small{font-size:11px;letter-spacing:.3em;color:#d9a3b0}

/* ---------- floating controls ---------- */
.ctl{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;z-index:5}
#tvctl{opacity:.35;transition:opacity .2s}
#tvctl:hover,#tvctl:focus-within{opacity:1}
.ctl button{background:rgba(255,255,255,.6);border:1px solid rgba(30,18,22,.2);border-radius:999px;padding:6px 12px;font-size:12px}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.status{font-family:var(--f-cjk);font-size:11px;color:var(--muted);background:rgba(255,255,255,.55);padding:5px 10px;border-radius:999px}
.voice{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--card);border:0;border-radius:999px;padding:12px 30px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 10px 30px rgba(30,18,22,.25)}
.voice b{font-family:var(--f-latin);font-weight:600;font-size:18px;letter-spacing:.04em}
.voice small{font-size:12px;color:#d9a3b0;letter-spacing:.2em}
/* bilingual stack: English bold on top, Chinese small underneath */
.en-zh{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.en-zh b{font-family:var(--f-latin);font-weight:600}
.en-zh small{font-size:.68em;opacity:.8;letter-spacing:.1em;margin-top:2px}

/* ---------- Counter ---------- */
#counter{position:fixed;inset:0;overflow-y:auto;background:#f8e3e7}
.cwrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.chead{position:sticky;top:0;background:var(--ink);color:var(--card);margin-inline:-16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0;z-index:2}
.chead .r1{display:flex;justify-content:space-between;align-items:baseline;padding-inline:4px}
.chead .r1 b{font-family:var(--f-latin);font-weight:500;letter-spacing:.08em;font-size:16px}
.chead .r1 span{font-size:12px;color:#d9a3b0}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#d9a3b0;padding:10px 0 8px;font-size:18px;letter-spacing:.06em;min-height:56px;display:flex;justify-content:center;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--card);border-bottom-color:var(--petal)}
.tabs .c{font-family:var(--f-latin);font-size:15px;letter-spacing:0;color:var(--petal)}
.list{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:#fbeef1;border:1.5px solid #ecc3cc;border-radius:12px;padding:12px 12px 12px 14px;min-height:76px;box-sizing:border-box}
.item.late{border-color:#c4687a}
.item .n{font-family:var(--f-latin);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.item .mid{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .mid b{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid .sub{font-family:var(--f-latin);font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid .tag{font-size:12px}
.item .mid .tag svg{width:14px;height:14px}
.item .mid .tag img{width:16px;height:16px;border-radius:4px}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .meta{font-family:var(--f-latin),var(--f-cjk);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.late .meta{color:var(--late)}
.item .go{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:7px 14px;font-size:15px;min-height:48px;white-space:nowrap}
.item .go.soft{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.item .kds{font-size:12px;color:var(--muted)}
.item .kds.ok{color:#2f6b45}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:48px 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--card);border-radius:12px;padding:10px 10px 10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;z-index:6}
.toast button{background:var(--petal);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;min-height:40px}
.cerr{margin-top:14px;padding:12px 14px;border-radius:10px;background:#fff3f5;color:var(--late);font-size:14px;line-height:1.6}
.cerr input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid #d9a3b0;border-radius:8px;background:#fff}
.cerr button{background:var(--ink);color:var(--card);border:0;border-radius:8px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-kiosk" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="14" rx="2"/><path d="M9 7h6M9 10h4M12 16.5v4M8 21h8"/></g></symbol>
  <symbol id="i-online" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10 9.5h4l-.6 5h-2.8z"/><path d="M11 9.5v-.9a1 1 0 0 1 2 0v.9M11 18.5h2"/></g></symbol>
  <symbol id="i-dinein" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 11h16v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5z"/><path d="M7 11V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V11M10 7.5h4M8 15h8"/></g></symbol>
</svg>

<div id="tv">
  <div class="stage" id="stage">
    <div class="top">
      <div></div>
      <div class="brand"><b>MOLLY TEA</b><span>茉莉奶白</span></div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="head">
      <div><h1>READY FOR PICKUP</h1><div class="zh">请取餐</div></div>
      <div class="page" id="page" hidden></div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="foot">
      <span class="bi"><b>MOLLY TEA · SAN GABRIEL</b><small>茉莉奶白</small></span>
      <span class="more" id="more" hidden><b>More ready orders on the next page</b><small>下一页还有已出餐订单</small></span>
      <span class="bi r"><b>PLEASE SHOW YOUR NUMBER</b><small>凭取餐号领取</small></span>
    </div>
  </div>
  <button class="voice" id="voiceOn" type="button"><b>Tap to turn on voice announcements</b><small>点一下开启语音播报</small></button>
</div>

<div id="counter" hidden>
  <div class="cwrap">
    <div class="chead">
      <div class="r1"><b>MOLLY TEA</b><span>San Gabriel Counter · 柜台</span></div>
      <div class="tabs" role="tablist">
        <button id="t-todo" role="tab" type="button" aria-selected="true"><span class="en-zh"><b>To Serve</b><small>出餐</small></span><span class="c" id="c-todo">0</span></button>
        <button id="t-ready" role="tab" type="button" aria-selected="false"><span class="en-zh"><b>Pickup</b><small>取餐</small></span><span class="c" id="c-ready">0</span></button>
      </div>
    </div>
    <div id="cerr"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo" type="button"><span class="en-zh"><b>Undo</b><small>撤销</small></span></button></div>

<div class="ctl" id="tvctl" role="group" aria-label="切换视图">
  <span class="status" id="status">连接中…</span>
  <button id="v-tv" type="button" aria-pressed="true">Screen 顾客屏</button>
  <button id="v-counter" type="button" aria-pressed="false">Counter 柜台</button>
</div>

  var CH = {

  };
  var $ = function(id){ return document.getElementById(id); };
  var view = "tv", ctab = "todo";

  var voiceOn = false, undoBuf = null, undoTimer = null;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function trim(s){ return String(s == null ? "" : s).trim(); }
  function tagHTML(ch){
    var c = CH[ch] || CH.online;
    var mark = c.img ? '<img src="' + LOGO[c.img] + '" alt="">' : '<svg aria-hidden="true"><use href="#' + c.icon + '"/></svg>';
    return '<span class="tag">' + mark + '<span>' + esc(c.tag) + '</span></span>';
  }
  // 识别信息：外卖按平台规则，其余显示名字
  function idLines(o){
    var nm = trim(o.nm), cd = trim(o.cd);
    if (o.ch === "panda") return [cd || "", ""];
    if (o.ch === "uber" || o.ch === "doordash") return [nm || cd, nm ? cd : ""];

  }
  function speechText(o){

    if (o.ch === "uber") return "Uber Eats, " + (nm || cd) + ", your order is ready";
    if (o.ch === "doordash") return "DoorDash, " + (nm || cd) + ", your order is ready";

  // 最新出餐排最前（服务端已按出餐时间倒序）。超过 30 单才翻页，每页停 7 秒。
  function renderTV(){
    var all = board.list.filter(function(o){ return !hidden[o.g]; }), html = "", now = Date.now() + counter.skew;

    if (page >= pages) { page = 0; pageAt = Date.now(); }
    var list = all.slice(page * MAX, page * MAX + MAX);
    list.forEach(function(o){
      var lines = idLines(o), age = (now - Date.parse(o.s)) / 1000;
      var fresh = age < FRESH_S, arrive = !seen[o.g] && !firstBoard;

        '<div class="r1"><span class="n">' + esc(o.n) + '</span>' + tagHTML(o.ch) + '</div>' +
        '<div class="id"><span class="l1">' + (esc(lines[0]) || "&nbsp;") + '</span>' + (lines[1] ? '<span class="l2">' + esc(lines[1]) + '</span>' : "") + '</div>' +
        (fresh ? '<span class="jr"><b>JUST READY</b><small>刚出餐</small></span>' : "") + '</div>';
    });
    for (var i = list.length; i < MAX; i++) html += '<div class="slot" aria-hidden="true"></div>';
    var grid = $("grid");
    grid.innerHTML = html;
    var key = page + "/" + pages;
    if (key !== lastPageShown) {
      if (pages > 1 && lastPageShown !== -1) { grid.classList.remove("flip"); void grid.offsetWidth; grid.classList.add("flip"); }
      lastPageShown = key;
    }
    $("page").hidden = pages === 1; $("page").textContent = (page + 1) + " / " + pages;
    $("more").hidden = pages === 1;
  }

  /* ---------- Counter ---------- */
  function mmss(sec){ sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
  function renderCounter(){
    var now = Date.now() + counter.skew;
    var todo = counter.todo.filter(function(o){ return !hidden[o.g]; });
    var ready = counter.ready.filter(function(o){ return !hidden[o.g]; });
    $("c-todo").textContent = todo.length; $("c-ready").textContent = ready.length;
    $("t-todo").setAttribute("aria-selected", ctab === "todo"); $("t-ready").setAttribute("aria-selected", ctab === "ready");
    var rows = ctab === "todo" ? todo : ready;
    if (!counter.at) { $("list").innerHTML = '<div class="empty">Loading orders… · 正在读取订单…</div>'; return; }
    if (!rows.length) { $("list").innerHTML = '<div class="empty">' + (ctab === "todo" ? "No orders to serve · 没有待出餐的订单" : "No orders waiting for pickup · 没有待取餐的订单") + '</div>'; return; }
    $("list").innerHTML = rows.map(function(o){
      var lines = idLines(o), sub = lines[1] ? '<span class="sub">' + esc(lines[1]) + '</span>' : "";
      if (ctab === "todo") {
        var allDone = o.c > 0 && o.r >= o.c, wait = (now - Date.parse(o.t)) / 1000;
        return '<div class="item">' +
          '<span class="n">' + esc(o.n) + '</span>' +
          '<span class="mid"><b>' + (esc(lines[0]) || "（无名字）") + '</b>' + sub + tagHTML(o.ch) + '</span>' +
          '<span class="rt"><span class="kds' + (allDone ? " ok" : "") + '">Drinks ' + o.r + '/' + o.c + (allDone ? " done · 已做好" : "") + '</span>' +
          '<button class="go" type="button" data-act="serve" data-g="' + esc(o.g) + '" aria-label="Serve ' + esc(o.n) + '"><span class="en-zh"><b>Ready</b><small>出餐</small></span></button>' +
          '<span class="meta">Ordered ' + mmss(wait) + ' ago</span></span></div>';
      }
      var waited = (now - Date.parse(o.s)) / 1000, late = waited > 300;
      return '<div class="item' + (late ? " late" : "") + '">' +
        '<span class="n">' + esc(o.n) + '</span>' +
        '<span class="mid"><b>' + (esc(lines[0]) || "（无名字）") + '</b>' + sub + tagHTML(o.ch) + '</span>' +
        '<span class="rt"><span class="meta">Waiting ' + mmss(waited) + '</span>' +
        '<button class="go" type="button" data-act="pickup" data-g="' + esc(o.g) + '" aria-label="Picked up ' + esc(o.n) + '"><span class="en-zh"><b>Picked up</b><small>已取餐</small></span></button></span></div>';
    }).join("");
  }

  function render(){ if (view === "tv") renderTV(); else renderCounter(); }

  /* ---------- status ---------- */
  function setStatus(){
    var at = view === "tv" ? board.at : counter.at, err = view === "tv" ? board.err : counter.err, el = $("status");
    if (err) { el.textContent = err; return; }
    if (!at) { el.textContent = "连接中…"; return; }
    var age = Math.round((Date.now() - at) / 1000);
    el.textContent = age > 20 ? ("数据已 " + age + " 秒未更新") : "实时";
  }

  /* ---------- voice ---------- */
  // 稳定性：① 服务端不再只给最早 30 单，新出餐的单一定能被发现；② Chrome 的语音有时不触发 onend，
  // 以前队列会永远卡住（之后全部不报）——现在每条有看门狗超时，卡住就 cancel 并继续下一条；
  // ③ 保留当前 utterance 引用，避免被回收后 onend 丢失；④ 队列上限 8 条，批量出餐时丢最旧的（屏幕上仍显示）。
  var sayQ = [], speaking = null, sayDog = null, voice = null, SAY_MAX = 8;
  function pickVoice(){
    if (!("speechSynthesis" in window)) return;
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^en(-|_)US/i.test(v.lang); });
    var pref = [/Google US English/i, /Samantha/i, /Natural/i, /Aria|Jenny|Guy/i];
    for (var i = 0; i < pref.length && !voice; i++) voice = vs.filter(function(v){ return pref[i].test(v.name); })[0] || null;
    if (!voice) voice = vs[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text){
    if (!voiceOn || !("speechSynthesis" in window)) return;
    if (sayQ.indexOf(text) !== -1) return;
    sayQ.push(text);
    while (sayQ.length > SAY_MAX) sayQ.shift();
    if (!speaking) next();
  }
  function done(u){
    if (speaking !== u) return;
    clearTimeout(sayDog); speaking = null;
    setTimeout(next, 500);
  }
  function next(){
    if (speaking || !sayQ.length) return;
    var text = sayQ.shift();
    var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .92; if (voice) u.voice = voice;
    speaking = u;
    u.onend = u.onerror = function(){ done(u); };
    clearTimeout(sayDog);
    sayDog = setTimeout(function(){ try { speechSynthesis.cancel(); } catch (_) {} done(u); }, 4000 + text.length * 120);
    try { if (speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u); } catch (_) { done(u); }
  }
  // 保活：引擎暂停或卡住时恢复
  setInterval(function(){
    if (!voiceOn || !("speechSynthesis" in window)) return;
    if (speechSynthesis.paused) speechSynthesis.resume();
    if (!speaking && sayQ.length) next();
  }, 5000);
  $("voiceOn").addEventListener("click", function(){
    voiceOn = true; $("voiceOn").hidden = true;
    try { speechSynthesis.cancel(); } catch (_) {}
    say("Voice announcements on");
  });

  /* ---------- data ---------- */
  function get(viewName){
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
    return fetch(FEED + "?view=" + viewName, { cache: "no-store", signal: ctl ? ctl.signal : undefined }).then(function(r){
      clearTimeout(to); if (!r.ok) throw new Error("http " + r.status); return r.json();
    }, function(e){ clearTimeout(to); throw e; });
  }
  var tb = null, tc = null, busyB = false, busyC = false;
  function pollBoard(){
    clearTimeout(tb); if (busyB) return; busyB = true;
    get("board").then(function(b){
      busyB = false; board.err = null; board.at = Date.now();
      if (b.now) counter.skew = Date.parse(b.now) - Date.now();
      var list = b.ready || [];
      if (!firstBoard) {
        var fresh = list.filter(function(o){ return !seen[o.g]; });
        fresh.slice().reverse().forEach(function(o){ say(speechText(o)); });
        if (fresh.length) { page = 0; pageAt = Date.now(); }
      }
      board.list = list;
      if (view === "tv") renderTV();
      list.forEach(function(o){ seen[o.g] = 1; });
      firstBoard = false; setStatus();
      tb = setTimeout(pollBoard, POLL_MS);
    }).catch(function(){
      busyB = false; board.err = navigator.onLine === false ? "网络断开，正在重连" : "暂时连不上订单数据，正在重试"; setStatus();
      tb = setTimeout(pollBoard, POLL_MS * 2);
    });
  }
  function pollCounter(){
    clearTimeout(tc); if (busyC || view !== "counter") return; busyC = true;
    get("counter").then(function(b){
      busyC = false; counter.err = null; counter.at = Date.now();
      if (b.now) counter.skew = Date.parse(b.now) - Date.now();
      counter.todo = b.todo || []; counter.ready = b.ready || [];
      renderCounter(); setStatus();
      tc = setTimeout(pollCounter, POLL_MS);
    }).catch(function(){
      busyC = false; counter.err = "暂时连不上订单数据，正在重试"; setStatus();
      tc = setTimeout(pollCounter, POLL_MS * 2);
    });
  }

  /* ---------- actions ---------- */
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  function getPin(){ try { return localStorage.getItem("cb_pin") || ""; } catch (_) { return ""; } }
  function setPin(v){ try { localStorage.setItem("cb_pin", v); } catch (_) {} }
  function deviceId(){
    try {
      var d = localStorage.getItem("cb_device");
      if (!d) { d = "dev-" + Math.random().toString(36).slice(2, 10); localStorage.setItem("cb_device", d); }
      return d;
    } catch (_) { return "dev-unknown"; }
  }
  function act(g, action){
    return fetch(FEED, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ g: g, action: action, pin: getPin(), device: deviceId() }) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok || !j.ok) { var e = new Error(j.error || ("http " + r.status)); e.code = j.error; throw e; } return j; }); });
  }
  function askPin(msg){
    $("cerr").innerHTML = '<div class="cerr"><div>' + esc(msg) + '</div><div style="display:flex;gap:8px;margin-top:10px"><label for="pin" style="position:absolute;left:-9999px">门店 PIN</label><input id="pin" inputmode="numeric" autocomplete="off" placeholder="输入门店 PIN"><button id="pinOk" type="button">保存</button></div></div>';
    $("pinOk").onclick = function(){ var v = $("pin").value.trim(); if (v) { setPin(v); $("cerr").innerHTML = ""; } };
  }
  function find(g){ return counter.todo.concat(counter.ready).filter(function(x){ return x.g === g; })[0]; }
  $("list").addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var g = b.getAttribute("data-g"), action = b.getAttribute("data-act"); if (!UUID.test(g)) return;
    if (!getPin()) { askPin("第一次使用，请先输入门店 PIN（只需要输入一次）。"); return; }
    var o = find(g); if (!o) return;
    hidden[g] = 1; renderCounter();
    act(g, action).then(function(){
      undoBuf = { g: g, undo: action === "serve" ? "unserve" : "unpickup" };
      $("toastMsg").textContent = "#" + o.n + (action === "serve" ? " on screen · 已上顾客屏" : " picked up · 已从顾客屏移除");
      $("toast").hidden = false;
      clearTimeout(undoTimer); undoTimer = setTimeout(function(){ $("toast").hidden = true; undoBuf = null; }, 5000);
      setTimeout(function(){ delete hidden[g]; }, 4000);
      pollCounter();
    }, function(err){
      delete hidden[g]; renderCounter();
      if (err.code === "wrong_pin") { setPin(""); askPin("门店 PIN 不对，请重新输入。"); return; }
      if (err.code === "locked") { setPin(""); $("cerr").innerHTML = '<div class="cerr">密码输错次数太多，已锁定 15 分钟，请稍后再试。</div>'; return; }
      if (err.code === "pin_not_set") { $("cerr").innerHTML = '<div class="cerr">后台还没设置门店 PIN，暂时不能操作。</div>'; return; }
      $("cerr").innerHTML = '<div class="cerr">' + esc(o.n) + ' 号没有操作成功，请再点一次。</div>';
      setTimeout(function(){ $("cerr").innerHTML = ""; }, 6000);
    });
  });
  $("undo").addEventListener("click", function(){
    var u = undoBuf; if (!u) return;
    $("toast").hidden = true; undoBuf = null;
    act(u.g, u.undo).then(function(){ delete hidden[u.g]; pollCounter(); }, function(){ delete hidden[u.g]; pollCounter(); });
  });
  $("t-todo").onclick = function(){ ctab = "todo"; renderCounter(); };
  $("t-ready").onclick = function(){ ctab = "ready"; renderCounter(); };

  /* ---------- view ---------- */
  function setView(v){
    view = v; $("tv").hidden = v !== "tv"; $("counter").hidden = v !== "counter";
    $("v-tv").setAttribute("aria-pressed", v === "tv"); $("v-counter").setAttribute("aria-pressed", v === "counter");
    document.body.style.overflow = v === "tv" ? "hidden" : "auto";
    $("tvctl").style.opacity = v === "tv" ? "" : "1";
    if (v === "counter") pollCounter(); else renderTV();
    setStatus();
  }
  $("v-tv").onclick = function(){ setView("tv"); };
  $("v-counter").onclick = function(){ setView("counter"); };

  setInterval(function(){
    var d = new Date(); $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    setStatus();
    if (view === "counter") renderCounter(); else renderTV();
  }, 1000);

  if (location.hash === "#counter") setView("counter"); else setView("tv");
  pollBoard();
})();
</script>

</html>
